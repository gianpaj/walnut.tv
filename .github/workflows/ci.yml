name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Validates the 24-character YouTube channel IDs in channels.js.
      - run: pnpm check-channels

      # Warns about channels that no longer exist or have no public videos.
      # Never fails the build; skipped when the secret is unavailable (forks).
      - run: pnpm check-channel-uploads
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
